# Airflow 3 local (LocalExecutor) para orquestar el laboratorio.
#   cp .env.example .env   # y completar AIRFLOW_JWT_SECRET
#   docker compose up -d --build
#   UI: http://localhost:8080 (sin login: todos son administradores en local)
#
# Monta dags/ y el proyecto (src/, config/, data/, forecasts/, models/) en /opt/proyecto.

x-airflow-comun: &airflow-comun
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: laboratorio-airflow:3.2.2
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?definir AIRFLOW_JWT_SECRET en .env}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__CORE__PARALLELISM: "3"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/proyecto/src
    # El contenedor no tiene .git: el manifiesto toma el SHA de aquí (export LABORATORIO_GIT_SHA=$(git rev-parse HEAD)).
    LABORATORIO_GIT_SHA: ${LABORATORIO_GIT_SHA:-}
    LABORATORIO_GIT_SUCIO: ${LABORATORIO_GIT_SUCIO:-}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/proyecto/src:ro
    - ./config:/opt/proyecto/config:ro
    - ./data:/opt/proyecto/data
    - ./forecasts:/opt/proyecto/forecasts
    - ./models:/opt/proyecto/models
    - ./dvc.lock:/opt/proyecto/dvc.lock:ro
    - ./docker:/opt/proyecto/docker:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depende
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-comun
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"

  airflow-apiserver:
    <<: *airflow-comun
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-comun
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-comun
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init:
        condition: service_completed_successfully

  # Un solo uso: activa los DAGs y lanza el backfill de todo el periodo (docker/orquestar.sh).
  airflow-orquestador:
    <<: *airflow-comun
    command: ["bash", "/opt/proyecto/docker/orquestar.sh"]
    restart: "no"
    depends_on:
      <<: *airflow-depende
      airflow-apiserver:
        condition: service_healthy
      airflow-scheduler:
        condition: service_healthy
      airflow-dag-processor:
        # Solo iniciado: su healthcheck puede marcarse unhealthy bajo carga; el script espera a que los DAGs aparezcan.
        condition: service_started

volumes:
  postgres-db:
  airflow-logs:
