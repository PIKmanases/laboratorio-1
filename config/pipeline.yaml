# Parámetros del pipeline (versionado)

datos:
  # Zip descargado de Kaggle, tal cual. El flujo lo lee directamente (sin comandos de DVC).
  zip_kaggle: data/raw/kaggle/store-sales-time-series-forecasting.zip
  # Archivos que deben venir dentro del zip.
  archivos:
    - train.csv
    - stores.csv
    - holidays_events.csv
    - oil.csv
    - transactions.csv
  # Tablas de referencia: entran completas en la carga inicial.
  referencias:
    - stores.csv
    - holidays_events.csv


simulacion:
  # true: el DAG diario genera la bandeja del día con el simulador. En producción, false.
  activa: true

bandeja:
  # Simulador de la bandeja de entrada (src/laboratorio/inbox).
  dir: data/inbox
  # Carga histórica inicial: todo dato con fecha <= fecha_corte se lee del zip.
  # Lo posterior llega por la bandeja, un archivo por fecha y fuente.
  fecha_corte: "2017-06-30"
  fecha_fin: "2017-08-15"   # última fecha de train.csv
  semilla: 42
  fuentes:
    ventas:
      archivo: train.csv
      columna_valor: sales
      retraso_dias: 1
    transacciones:
      archivo: transactions.csv
      columna_valor: transactions
      retraso_dias: 2
    petroleo:
      archivo: oil.csv
      columna_valor: dcoilwtico
      retraso_dias: 3
  revisiones:
    fraccion_fechas: 0.15      # fechas de cada fuente que reciben un _rev2
    fraccion_filas: 0.05       # filas con valor erróneo en la versión original
    retraso_extra_dias: 3      # el _rev2 llega estos días después del original

capas:
  bronze: data/bronze           # ingesta: lo recibido, tal cual, con todas sus revisiones
  silver: data/silver           # validación: solo las revisiones que pasan las reglas
  cuarentena: data/cuarentena   # revisiones rechazadas, con sus motivos
  features: data/features       # predictores as-of por fecha de corte
  pronosticos: forecasts        # pronósticos y pedidos semanales
  seguimiento: data/monitoring  # desempeño de pronósticos y pedidos
  modelos: models

validacion:
  # Esquema por fuente (validado con pandera). Por columna: tipo, nulos permitidos y rango.
  # Además se valida: sin columnas extra, claves únicas, date == fecha de la partición,
  # date <= available_at, tiendas conocidas y revision/available_at en cada fila.
  ventas:
    claves: [date, store_nbr, family]
    validar_tiendas: true
    columnas:
      id:          {tipo: int64, min: 0}
      date:        {tipo: str}
      store_nbr:   {tipo: int64, min: 1}
      family:      {tipo: str}
      sales:       {tipo: float64, min: 0}
      onpromotion: {tipo: int64, min: 0}
  transacciones:
    claves: [date, store_nbr]
    validar_tiendas: true
    columnas:
      date:         {tipo: str}
      store_nbr:    {tipo: int64, min: 1}
      transactions: {tipo: int64, min: 0}
  petroleo:
    claves: [date]
    validar_tiendas: false
    columnas:
      date:       {tipo: str}
      dcoilwtico: {tipo: float64, nulos: true, min: 0, max: 200}   # puede venir vacío

features:
  ventana_dias: 28            # historia usada para los predictores de cada corte
  historia_cortes_dias: 364   # cortes pasados que se preparan en la primera corrida (para entrenar)

pronostico:
  modelo: media_dia_semana    # línea base; se reemplaza en la fase de modelado
  horizonte_dias: 7           # días que cubre cada pronóstico/pedido
  anticipacion_dias: 1        # el pedido del día X cubre de X+1 a X+horizonte

seguimiento:
  umbral_wape: 0.35           # alerta si el WAPE total de un pronóstico lo supera

orquestacion:
  inicio: "2017-06-30"        # primer día (carga histórica)
  fin: "2017-08-21"           # último día con llegadas a la bandeja
  hora: 6                     # hora UTC de las corridas
  dia_semana_pronostico: 0    # 0 = lunes
  reintentos: 1
  minutos_entre_reintentos: 1
  sensores:
    poke_interval_s: 20
    timeout_s: 21600
  dags:
    ingesta_validacion:    {frecuencia: diaria, depends_on_past: true}
    preparacion_features:  {frecuencia: diaria, depends_on_past: false}
    pronostico_pedido:     {frecuencia: semanal, depends_on_past: true}
    seguimiento_desempeno: {frecuencia: diaria, depends_on_past: true}

modelado:
  # Modelo candidato: LightGBM por cuantiles (un modelo por cuantil, sobre log1p(ventas)).
  # La línea base (campeón inicial) es la media del mismo día de la semana.
  baseline: media_dia_semana
  cuantiles: [0.1, 0.5, 0.9]  # el pronóstico es la mediana; sigma sale de (p90 - p10)
  semanas_entrenamiento: 52   # cortes semanales (lunes) hacia atrás usados para entrenar
  folds: 4                    # cortes de prueba: los últimos lunes con horizonte completo observado
  dias_espera_etiquetas: 11   # purga: anticipación+horizonte (8) + llegada del _rev2 (3)
  lightgbm:
    n_estimators: 150
    learning_rate: 0.1
    num_leaves: 63
    min_child_samples: 100
    feature_fraction: 0.8
    bagging_fraction: 0.7
    bagging_freq: 1
    max_bin: 127
    n_jobs: 4                 # laptop: no usar todos los núcleos
    seed: 42
  # Regla de reemplazo del campeón (ver laboratorio.forecast.reemplazo).
  reemplazo:
    mejora_minima_costo: 0.02     # el costo de negocio debe bajar al menos 2 %
    tolerancia_wape: 0.0          # el WAPE no puede ser peor que el del campeón
    folds_ganados_minimos: 3      # gana en costo en al menos 3 de los 4 folds
    fill_rate_minimo: 0.85        # servicio mínimo aceptable
    sesgo_maximo: 0.10            # |sesgo| agregado <= 10 %
    cobertura_intervalo: [0.70, 0.90]   # cobertura real de [p10, p90] (nominal 80 %)
